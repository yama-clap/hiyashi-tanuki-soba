# Supabase 無料プランの自動一時停止（7日間 DBアクティビティなしで pause）を防ぐキープアライブ。
#
# 【重要】停止タイマーは「実際のDB書き込み/読み取り(=Postgresに届くクエリ)」でしか
# リセットされない。単なる GET は API ゲートウェイにキャッシュされて Postgres に届かず、
# タイマーをリセットしないことが実測で判明した（HTTP 200 でも停止した）。
# そこで「読み取り」ではなく専用テーブル keep_alive への【書き込み(UPDATE)】を行う。
# 書き込みはキャッシュされず必ず Postgres に届くため、確実にアクティビティとして記録される。
#
# 事前準備（1回だけ）: SETUP_RANKING.md の「キープアライブ用テーブル」SQL を SQL Editor で実行し、
# public.keep_alive テーブルと id=1 の初期行を作っておくこと。未実行だとこのジョブは失敗する。
#
# 注意:
#  - スケジュール実行は「デフォルトブランチ(main)」に置かれている場合のみ動く。
#  - リポジトリに60日間コミットが無いと GitHub がスケジュールを自動停止する（長期放置時は手動実行 or 再有効化）。
name: Supabase keep-alive

on:
  schedule:
    # 2日ごと 15:00 UTC（= 日本時間 翌0:00）。停止しきい値7日に対し十分な余裕。
    - cron: '0 15 */2 * *'
  workflow_dispatch: {}       # 手動実行ボタン（動作確認用）

concurrency:
  group: supabase-keepalive
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Write heartbeat to Supabase (keeps the project active)
        run: |
          set -euo pipefail

          # config.js から値を抽出（'シングルクオート' 前提）
          URL=$(grep -oE "url:[[:space:]]*'[^']*'"     config.js | head -1 | sed -E "s/.*'([^']*)'.*/\1/")
          KEY=$(grep -oE "anonKey:[[:space:]]*'[^']*'" config.js | head -1 | sed -E "s/.*'([^']*)'.*/\1/")

          if [ -z "$URL" ] || [ -z "$KEY" ]; then
            echo "::error::config.js から url / anonKey を取得できませんでした"
            exit 1
          fi

          NOW=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          echo "Heartbeat UPDATE keep_alive (id=1, beat_at=$NOW) -> $URL"

          # 専用テーブル keep_alive の id=1 の行を UPDATE（PATCH）。
          # 書き込みなのでキャッシュされず必ず Postgres に届く＝アクティビティとして記録される。
          CODE=$(curl -sS -o /tmp/body.txt -w "%{http_code}" \
            --retry 3 --retry-delay 5 --max-time 30 \
            -X PATCH "$URL/rest/v1/keep_alive?id=eq.1" \
            -H "apikey: $KEY" \
            -H "Authorization: Bearer $KEY" \
            -H "Content-Type: application/json" \
            -H "Prefer: return=representation" \
            -d "{\"beat_at\":\"$NOW\"}")

          echo "HTTP $CODE"
          cat /tmp/body.txt || true
          echo

          if [ "$CODE" != "200" ]; then
            echo "::error::heartbeat 失敗 (HTTP $CODE)。プロジェクトが停止中か、keep_alive テーブル未作成の可能性。SETUP_RANKING.md のSQLを実行し、Resume済みか確認してください。"
            exit 1
          fi

          # 返り値が空配列 [] だと id=1 の行が無く UPDATE が0件＝書き込みが起きていない。
          if ! grep -q '"id"' /tmp/body.txt; then
            echo "::error::更新対象の行(id=1)がありません。SETUP_RANKING.md の seed INSERT を1回実行してください。"
            exit 1
          fi
          echo "OK: heartbeat written — Supabase activity registered."
