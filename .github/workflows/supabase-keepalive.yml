# Supabase 無料プランの自動一時停止（7日間アクセスなしで pause）を防ぐキープアライブ。
# config.js の url / anonKey / table を実行時に読み取り、REST に軽い SELECT を1回投げるだけ。
# 2日ごとに実行。手動実行(workflow_dispatch)でも即テストできる。
#
# 注意:
#  - スケジュール実行は「デフォルトブランチ(main)」に置かれている場合のみ動く。
#  - リポジトリに60日間コミットが無いと GitHub がスケジュールを自動停止する。
#    定期的に開発していれば問題ないが、長期放置時は Actions 画面から再有効化するか手動実行する。
name: Supabase keep-alive

on:
  schedule:
    # 2日ごと 15:00 UTC（= 日本時間 翌0:00）。停止しきい値の7日に対し十分な余裕。
    - cron: '0 15 */2 * *'
  workflow_dispatch: {}       # 手動実行ボタン（動作確認用）

# 同時に走らないように（連打・重複起動の保護）
concurrency:
  group: supabase-keepalive
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ping Supabase REST (keeps the project active)
        run: |
          set -euo pipefail

          # config.js から値を抽出（'シングルクオート' 前提）
          URL=$(grep -oE "url:[[:space:]]*'[^']*'"     config.js | head -1 | sed -E "s/.*'([^']*)'.*/\1/")
          KEY=$(grep -oE "anonKey:[[:space:]]*'[^']*'" config.js | head -1 | sed -E "s/.*'([^']*)'.*/\1/")
          TABLE=$(grep -oE "table:[[:space:]]*'[^']*'"  config.js | head -1 | sed -E "s/.*'([^']*)'.*/\1/")
          TABLE=${TABLE:-scores}

          if [ -z "$URL" ] || [ -z "$KEY" ]; then
            echo "::error::config.js から url / anonKey を取得できませんでした"
            exit 1
          fi
          echo "Pinging $URL (table: $TABLE)"

          # 実際に DB へ届く軽い SELECT（1行だけ）。HTTPステータスで成否判定。
          CODE=$(curl -sS -o /tmp/body.txt -w "%{http_code}" \
            --retry 3 --retry-delay 5 --max-time 30 \
            "$URL/rest/v1/$TABLE?select=id&limit=1" \
            -H "apikey: $KEY" \
            -H "Authorization: Bearer $KEY")

          echo "HTTP $CODE"
          head -c 300 /tmp/body.txt || true
          echo

          if [ "$CODE" != "200" ]; then
            echo "::error::キープアライブ失敗 (HTTP $CODE)。プロジェクトが一時停止/削除されていないか確認してください。"
            exit 1
          fi
          echo "OK: Supabase is active."
