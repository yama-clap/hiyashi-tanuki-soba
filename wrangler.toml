# =====================================================================
# Cloudflare Pages 設定（ランキングAPI用の D1 バインディング）
# functions/api/scores.js から env.DB としてアクセスする。
#
# database_id は `npx wrangler d1 create tanuki-ranking` の出力値を入れる。
# ローカル確認: npx wrangler pages dev .
# =====================================================================
name = "hiyashi-tanuki"
compatibility_date = "2026-07-22"
pages_build_output_dir = "."

[[d1_databases]]
binding = "DB"                 # functions 側で env.DB として参照
database_name = "tanuki-ranking"
database_id = "8d236e09-2492-41a3-8ccf-355ea65c0cab"
