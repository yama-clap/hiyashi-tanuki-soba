<body>
  <!-- Google Tag Manager (noscript) -->
  <noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-N5T5V6X6"
  height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>
  <!-- End Google Tag Manager (noscript) -->
  <div id="stage">
    <!-- 表示用canvas。実サイズ(×dpr)とCSSサイズは game.js が設定する。
         描画は 180×320 のオフスクリーンに行い、ここへ nearest-neighbor で一括拡大する -->
    <canvas id="view"></canvas>
  </div>

  <!-- ランキング登録の名前入力（canvasの上に重ねるモーダル。スマホのキーボードが出る） -->
  <div id="nameModal" hidden>
    <div class="name-box">
      <p class="name-title">ランキングに登録</p>
      <input id="nameInput" type="text" maxlength="6" placeholder="なまえ" autocomplete="off" autocapitalize="off" spellcheck="false">
      <p class="name-hint">なまえは6文字まで</p>
      <div class="name-actions">
        <button id="nameCancel" type="button">やめる</button>
        <button id="nameOk" type="button">登録する</button>
      </div>
    </div>
  </div>

  <!-- 「これはキツイ」再戦時：ドッキリ画像 出す/出さない の確認（登録モーダルと同じ体裁） -->
  <div id="scareModal" hidden>
    <div class="name-box">
      <p class="name-title">ドッキリ画像を出しますか？</p>
      <div class="name-actions">
        <button id="scareNo" type="button">いいえ<span class="btn-sub">出さない</span></button>
        <button id="scareYes" type="button">はい<span class="btn-sub">出す</span></button>
      </div>
    </div>
  </div>

  <!-- ランキング設定 → ゲーム本体。非モジュール。 -->
  <script src="config.js"></script>
  <script src="game.js"></script>
</body>
